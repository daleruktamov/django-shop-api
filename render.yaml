# Blueprint для Render: создаёт веб-сервис и базу PostgreSQL одной кнопкой.
# DATABASE_URL подставляется автоматически из блока databases, SECRET_KEY и
# пароль администратора Render генерирует сам — вручную вводить нечего.
services:
  - type: web
    name: shop-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: shop-db
    plan: free
    region: frankfurt
    databaseName: shop
    user: shop
